<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malware Gen Framework</title>
<style>
:root {
  --bg:     #0d1117;
  --bg2:    #161b22;
  --bg3:    #21262d;
  --border: #30363d;
  --text:   #c9d1d9;
  --muted:  #8b949e;
  --accent: #388bfd;
  --green:  #3fb950;
  --yellow: #d29922;
  --red:    #f85149;
  --purple: #bc8cff;
  --mono: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace;
  --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;flex-direction:column}

/* ── Header ── */
.hdr{
  display:flex;align-items:center;gap:10px;padding:9px 16px;
  background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;
}
.hdr-dot{width:9px;height:9px;border-radius:50%;background:var(--red)}
.hdr h1{font-size:13px;font-weight:600}
.hdr-sub{font-size:12px;color:var(--muted)}
.hdr-sp{flex:1}
.hdr-badge{
  font-size:11px;padding:2px 9px;border-radius:10px;
  border:1px solid var(--border);color:var(--muted);
  font-family:var(--mono);
}
.hdr-badge.running{border-color:var(--green);color:var(--green)}
.hdr-badge.paused{border-color:var(--yellow);color:var(--yellow)}

/* ── Layout ── */
.layout{flex:1;display:flex;overflow:hidden}

/* ── Sidebar ── */
.sidebar{
  width:310px;min-width:310px;background:var(--bg2);
  border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;
}

/* Command tabs */
.tabs{
  display:flex;flex-wrap:wrap;gap:2px;padding:8px 8px 0;
  border-bottom:1px solid var(--border);background:var(--bg2);
}
.tab{
  padding:5px 9px;font-size:11px;font-weight:600;cursor:pointer;
  border:1px solid transparent;border-bottom:none;border-radius:5px 5px 0 0;
  color:var(--muted);background:transparent;transition:all .12s;
  text-transform:uppercase;letter-spacing:.04em;
}
.tab:hover{color:var(--text);background:var(--bg3)}
.tab.active{color:var(--accent);border-color:var(--border);border-bottom-color:var(--bg2);background:var(--bg2)}

/* Form area */
.form-scroll{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}

.sec{display:flex;flex-direction:column;gap:7px}
.sec-hdr{
  font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.08em;padding-bottom:5px;border-bottom:1px solid var(--border);
}

.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:3px}
.req{color:var(--red);font-size:10px}

input[type=text],input[type=number],select,textarea{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:5px 8px;border-radius:5px;font-size:12px;font-family:var(--sans);
  width:100%;outline:none;transition:border-color .12s;
}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{
  border-color:var(--accent);
}
textarea{resize:vertical;min-height:54px;font-family:var(--sans)}
select option{background:var(--bg3)}

.chk-row{
  display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text);
  cursor:pointer;user-select:none;padding:1px 0;
}
input[type=checkbox]{accent-color:var(--accent);width:13px;height:13px;cursor:pointer;flex-shrink:0}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}

/* Mode selector */
.mode-pair{display:flex;gap:6px}
.mode-btn{
  flex:1;padding:6px 4px;font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);border-radius:5px;color:var(--muted);
  background:var(--bg3);text-align:center;transition:all .12s;
}
.mode-btn:hover{color:var(--text);border-color:var(--muted)}
.mode-btn.sel{color:var(--accent);border-color:var(--accent);background:rgba(56,139,253,.08)}
.mode-btn.cloud.sel{color:var(--purple);border-color:var(--purple);background:rgba(188,140,255,.08)}

/* Disabled section */
.sec.sec-disabled{opacity:.35;pointer-events:none}

/* LLM endpoint toggle */
.llm-pair{display:flex;gap:6px;margin-bottom:5px}
.llm-btn{
  flex:1;padding:6px 4px;font-size:11px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);border-radius:5px;color:var(--muted);
  background:var(--bg3);text-align:center;transition:all .12s;
}
.llm-btn:hover{color:var(--text);border-color:var(--muted)}
.llm-btn.sel{color:var(--green);border-color:var(--green);background:rgba(63,185,80,.08)}

/* Run button */
.run-wrap{padding:10px 12px 12px;flex-shrink:0}
.run-btn{
  width:100%;padding:9px;background:var(--green);color:#0d1117;
  font-size:13px;font-weight:700;border:none;border-radius:6px;cursor:pointer;
  transition:background .12s;
}
.run-btn:hover{background:#3dd68c}
.run-btn:disabled{background:var(--bg3);color:var(--muted);cursor:not-allowed}
.run-btn.stop{background:var(--red);color:#fff}
.run-btn.stop:hover{background:#ff6b63}
.run-btn.paused{background:var(--yellow);color:#0d1117}
.run-btn.paused:hover{background:#e5b329}

/* ── Main panel ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* Jobs bar */
.jobs-bar{
  padding:6px 12px;background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-height:38px;
}
.jobs-lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.job-chip{
  font-size:11px;padding:2px 9px;border-radius:10px;cursor:pointer;
  border:1px solid var(--border);color:var(--muted);font-family:var(--mono);
  transition:all .12s;white-space:nowrap;
}
.job-chip:hover{opacity:.8}
.job-chip.running{color:var(--green);border-color:var(--green);background:rgba(63,185,80,.08)}
.job-chip.success{color:var(--accent);border-color:var(--accent);background:rgba(56,139,253,.08)}
.job-chip.failed,.job-chip.error,.job-chip.killed{color:var(--red);border-color:var(--red);background:rgba(248,81,73,.08)}
.job-chip.active{box-shadow:0 0 0 2px rgba(56,139,253,.25)}
.jobs-empty{font-size:12px;color:var(--muted)}

/* Terminal */
.term-wrap{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.term{
  flex:1;overflow-y:auto;padding:12px 16px;
  font-family:var(--mono);font-size:12px;line-height:1.75;
  background:#080d12;color:#c9d1d9;
}
.ll{white-space:pre-wrap;word-break:break-all}
.ll.info {}
.ll.dbg {color:#6e7681}
.ll.warn{color:var(--yellow)}
.ll.err {color:var(--red)}
.ll.ok  {color:var(--green)}
.ll.meta{color:var(--purple);font-style:italic}
.term-hint{
  color:var(--muted);text-align:center;margin-top:60px;
  font-family:var(--mono);font-size:12px;line-height:2.2;
}
.cursor{
  display:inline-block;width:8px;height:13px;
  background:var(--green);vertical-align:text-bottom;
  animation:blink 1s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Results pane */
.res-pane{
  border-top:1px solid var(--border);background:var(--bg2);
  display:flex;flex-direction:column;transition:max-height .15s;
}
.res-hdr{
  display:flex;align-items:center;padding:6px 12px;gap:6px;
  cursor:pointer;user-select:none;flex-shrink:0;
}
.res-hdr span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.res-toggle{font-size:10px;color:var(--muted);margin-left:auto}
.res-files{display:flex;gap:5px;padding:0 12px 8px;flex-wrap:wrap;max-height:90px;overflow-y:auto}
.res-file{
  font-size:11px;padding:2px 9px;background:var(--bg3);border:1px solid var(--border);
  border-radius:4px;color:var(--text);cursor:pointer;font-family:var(--mono);transition:border-color .12s;
}
.res-file:hover{border-color:var(--accent);color:var(--accent)}
.res-empty{font-size:12px;color:var(--muted);padding:0 0 8px}

/* Modal */
.modal-bg{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
  z-index:200;justify-content:center;align-items:center;
}
.modal-bg.open{display:flex}
.modal{
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  width:82vw;max-height:82vh;display:flex;flex-direction:column;
}
.modal-hdr{
  display:flex;align-items:center;padding:10px 14px;
  border-bottom:1px solid var(--border);gap:8px;flex-shrink:0;
}
.modal-title{font-size:13px;font-weight:600;font-family:var(--mono)}
.modal-x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:0 2px}
.modal-x:hover{color:var(--text)}
.modal-body{flex:1;overflow-y:auto;padding:14px}
.modal-body pre{font-family:var(--mono);font-size:12px;line-height:1.65;color:#c9d1d9;white-space:pre-wrap}

/* SSH xterm container */
#xterm-container{flex:1;overflow:hidden;display:none;background:#000;padding:4px}
#xterm-container.active{display:block}
.ssh-status{
  padding:3px 12px;font-family:var(--mono);font-size:11px;
  color:var(--muted);background:var(--bg2);border-bottom:1px solid var(--border);
  flex-shrink:0;display:none;
}
.ssh-status.active{display:block}

/* Scrollbars */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#484f58}

/* EDR Management */
.edr-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 8px;background:var(--bg3);border-radius:4px;
}
.edr-row .edr-info{display:flex;flex-direction:column;gap:1px}
.edr-row .edr-name{font-size:12px;font-weight:600}
.edr-row .edr-detail{font-size:10px;color:var(--muted)}
.edr-toggle{
  position:relative;width:36px;height:20px;cursor:pointer;
  background:var(--border);border-radius:10px;border:none;
  transition:background .2s;flex-shrink:0;
}
.edr-toggle.on{background:var(--green)}
.edr-toggle::after{
  content:'';position:absolute;top:2px;left:2px;
  width:16px;height:16px;border-radius:50%;
  background:#fff;transition:transform .2s;
}
.edr-toggle.on::after{transform:translateX(16px)}
.edr-toggle.pending{opacity:.5;pointer-events:none}
.edr-preset-btn{
  flex:1;min-width:70px;padding:5px 8px;font-size:11px;font-weight:600;
  background:var(--bg3);color:var(--text);border:1px solid var(--border);
  border-radius:4px;cursor:pointer;transition:all .12s;
}
.edr-preset-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Mobile toggle button (hidden on desktop) */
.mobile-toggle{display:none}

/* ── Mobile responsive ── */
@media (max-width: 900px) {
  html,body{overflow:auto}

  /* Header: shrink text, keep badges visible */
  .hdr{padding:8px 10px;gap:6px;flex-wrap:wrap}
  .hdr h1{font-size:12px}
  .hdr-sub{display:none}
  .hdr-badge{font-size:10px;padding:2px 7px}

  /* Layout: stack vertically instead of side-by-side */
  .layout{flex-direction:column;overflow:auto}

  /* Sidebar: full width, collapsible */
  .sidebar{
    width:100%;min-width:0;border-right:none;
    border-bottom:1px solid var(--border);
    max-height:none;overflow:visible;
  }
  .sidebar.collapsed .form-scroll,
  .sidebar.collapsed .run-wrap{display:none}

  /* Mobile toggle: hamburger to show/hide form */
  .mobile-toggle{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;cursor:pointer;user-select:none;
    background:var(--bg2);border-bottom:1px solid var(--border);
  }
  .mobile-toggle span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .mobile-toggle .arrow{font-size:10px;color:var(--muted);transition:transform .15s}
  .sidebar.collapsed .mobile-toggle .arrow{transform:rotate(180deg)}

  /* Tabs: scrollable row, bigger touch targets */
  .tabs{
    overflow-x:auto;flex-wrap:nowrap;padding:6px 6px 0;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    padding:8px 12px;font-size:12px;white-space:nowrap;
    flex-shrink:0;min-height:36px;
  }

  /* Form: constrain height when expanded so terminal is still visible */
  .form-scroll{
    max-height:50vh;overflow-y:auto;padding:10px;
  }

  /* Run button: bigger tap target */
  .run-wrap{padding:8px 10px 10px}
  .run-btn{padding:12px;font-size:14px;min-height:44px}

  /* Main panel: take remaining space */
  .main{min-height:40vh;flex:1}

  /* Jobs bar */
  .jobs-bar{padding:6px 8px;overflow-x:auto;flex-wrap:nowrap}
  .jobs-bar::-webkit-scrollbar{display:none}
  .job-chip{font-size:10px;padding:4px 8px;flex-shrink:0}

  /* Terminal: readable on small screens */
  .term{padding:8px 10px;font-size:11px;line-height:1.6}

  /* Results pane */
  .res-files{padding:0 8px 8px}
  .res-file{font-size:10px;padding:4px 8px}

  /* Modal: nearly full screen */
  .modal{width:95vw;max-height:90vh;border-radius:6px}
  .modal-hdr{padding:10px 12px}
  .modal-title{font-size:12px}
  .modal-body{padding:10px}
  .modal-body pre{font-size:11px;line-height:1.5}

  /* Form fields: bigger tap targets */
  input[type=text],input[type=number],select,textarea{
    padding:8px 10px;font-size:14px;min-height:40px;
  }
  select{font-size:13px}
  .chk-row{padding:4px 0;font-size:13px;min-height:36px}
  input[type=checkbox]{width:18px;height:18px}
  .field label{font-size:13px}
  .sec-hdr{font-size:11px;padding-bottom:6px}

  /* Mode buttons */
  .mode-btn{padding:10px 4px;font-size:13px;min-height:40px}
  .llm-btn{padding:8px 4px;font-size:12px;min-height:40px}

  /* SSH xterm */
  #xterm-container{min-height:300px}
}

/* Extra small (phones in portrait) */
@media (max-width: 480px) {
  .hdr h1{font-size:11px}
  .tab{padding:7px 10px;font-size:11px}
  .form-scroll{max-height:45vh;padding:8px}
  .term{font-size:10px}
  input[type=text],input[type=number],select,textarea{font-size:13px}
}
</style>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

<body>

<div class="hdr">
  <div class="hdr-dot"></div>
  <h1>Malware Gen Framework</h1>
  <span class="hdr-sub">localhost portal</span>
  <div class="hdr-sp"></div>
  <span class="hdr-badge" id="status-badge">idle</span>
  <span class="hdr-badge" id="c2-badge" title="C2 Listener" style="cursor:pointer" onclick="document.querySelector('[data-cmd=listener]').click()">C2: off</span>
</div>

<div class="layout">

  <!-- ── Sidebar ── -->
  <div class="sidebar" id="sidebar">
    <div class="mobile-toggle" id="mobile-toggle" onclick="toggleSidebar()">
      <span id="mobile-toggle-label">Configure</span>
      <span class="arrow">&#9650;</span>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-cmd="run">run</button>
      <button class="tab" data-cmd="generate">generate</button>
      <button class="tab" data-cmd="vm">vm</button>
      <button class="tab" data-cmd="verify">verify</button>
      <button class="tab" data-cmd="analyze">analyze</button>
      <button class="tab" data-cmd="clean">clean</button>
      <button class="tab" data-cmd="ssh">ssh</button>
      <button class="tab" data-cmd="listener">c2</button>
      <button class="tab" data-cmd="spec">spec</button>
      <button class="tab" data-cmd="chunk">chunk</button>
      <button class="tab" data-cmd="edr">edr</button>
    </div>
    <div class="form-scroll" id="form-area"></div>
    <div class="run-wrap" style="display:flex;gap:6px">
      <button class="run-btn" id="run-btn" style="flex:1">&#9654;&#xFE0E;  Run</button>
      <button class="run-btn paused" id="pause-btn" style="width:70px;display:none">⏸  Pause</button>
    </div>
  </div>

  <!-- ── Main panel ── -->
  <div class="main">

    <!-- Jobs bar -->
    <div class="jobs-bar" id="jobs-bar">
      <span class="jobs-lbl">Jobs</span>
      <span class="jobs-empty" id="jobs-empty">no jobs yet</span>
    </div>

    <!-- Terminal -->
    <div class="term-wrap">
      <div class="ssh-status" id="ssh-status">SSH — disconnected</div>
      <div class="term" id="term">
        <div class="term-hint" id="term-hint">
          Configure a command on the left and press Run<br>
          <span class="cursor"></span>
        </div>
      </div>
      <div id="xterm-container"></div>
    </div>

    <!-- Results pane -->
    <div class="res-pane" id="res-pane">
      <div class="res-hdr" id="res-hdr">
        <span>Results</span>
        <span class="res-toggle" id="res-toggle">&#9650;</span>
      </div>
      <div class="res-files" id="res-files">
        <span class="res-empty">no results yet</span>
      </div>
    </div>

  </div>
</div>

<!-- File viewer modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title" id="modal-title"></span>
      <span class="modal-x" id="modal-x">&#xD7;</span>
    </div>
    <div class="modal-body"><pre id="modal-body"></pre></div>
  </div>
</div>

<script>
// ── Field definitions ────────────────────────────────────────────────────────
const CMDS = {
  run: [
    {s:'Target', f:[
      {id:'spec',         lbl:'Spec file',     type:'text', req:1, ph:'spec.yaml or /full/path/target.yaml'},
      {id:'malware_type', lbl:'Malware type',  type:'text', req:1, ph:'keylogger · ransomware · backdoor · info stealer…'},
      {id:'behavior',     lbl:'Behavior spec', type:'area', ph:'(optional) keylogger that sends to 10.0.0.5:9001 over AES-256 TCP, persists via HKCU Run key…'},
      {id:'output',       lbl:'Output dir',    type:'text', ph:'./results'},
    ]},
    {s:'Output', f:[
      {id:'source_language', lbl:'Language', type:'sel', opts:['c','go','best'], def:'c'},
      {id:'output_format',   lbl:'Format',   type:'sel', opts:['exe','dll','shellcode'], def:'exe'},
    ]},
    {s:'Mode', f:[{id:'mode', type:'mode'}]},
    {s:'Cloud', f:[
      {id:'cloud_provider', lbl:'Provider', type:'sel',
        opts:['fugu','openrouter'], def:'fugu'},
      {id:'cloud_model', lbl:'Model override', type:'text',
        ph:'openrouter: deepseek/deepseek-r1-0528, anthropic/claude-sonnet-4-5…'},
    ]},
    {s:'Local LLM', f:[
      {id:'llm_url',   type:'llm_endpoint'},
      {id:'llm_model', lbl:'Model name', type:'text', ph:'qwen3-35b-a3b… (blank = use loaded model)'},
    ]},
    {s:'Planning', f:[
      {id:'plan_review_cycles', lbl:'Review cycles', type:'num', ph:'10', def:'10'},
      {id:'plan_review_infinite', lbl:'Infinite (loop until approved)', type:'chk'},
    ]},
    {s:'Loop', f:[
      {id:'loop',      lbl:'Enable retry loop',                    type:'chk'},
      {id:'exhaustive',lbl:'Exhaustive (try all techniques)',      type:'chk'},
      {id:'max_iters', lbl:'Max iterations',  type:'num', ph:'5', def:'5'},
      {id:'min_iters', lbl:'Min iterations',  type:'num', ph:'1', def:'1'},
    ]},
    {s:'VM', f:[
      {id:'boot_existing',  lbl:'Boot existing VM disk (--boot-existing)',   type:'chk'},
      {id:'use_existing_vm',lbl:'Use already-running VM (--use-existing-vm)',type:'chk'},
      {id:'os', lbl:'OS (--boot-existing)', type:'sel',
        opts:['windows-11','windows-10','ubuntu-24.04','ubuntu-22.04'], def:'windows-11'},
      {id:'vm_port', lbl:'SSH port',     type:'num', ph:'10022', def:'10022'},
      {id:'vm_user', lbl:'SSH username', type:'text', ph:'vmuser'},
      {id:'vm_pass', lbl:'SSH password', type:'text', ph:'vmuser123'},
    ]},
    {s:'Flags', f:[
      {id:'verbose', lbl:'Verbose logging',       type:'chk'},
      {id:'debug',   lbl:'Debug mode (step trace)',type:'chk'},
    ]},
  ],
  generate: [
    {s:'Target', f:[
      {id:'spec',         lbl:'Spec file',    type:'text', req:1, ph:'spec.yaml'},
      {id:'malware_type', lbl:'Malware type', type:'text', req:1, ph:'keylogger · ransomware · backdoor…'},
      {id:'behavior',     lbl:'Behavior spec',type:'area', ph:'(optional) detailed behavioral requirements'},
      {id:'output',       lbl:'Output dir',   type:'text', ph:'./results'},
    ]},

// ── Form rendering ────────────────────────────────────────────────────────────
function renderForm(cmd) {
  const area = document.getElementById('form-area');
  area.innerHTML = '';
  const entry = CMDS[cmd];
  if (entry && entry.build) {
    entry.build(area);
    return;
  }
  const secs = entry || [];
  secs.forEach(sec => {
    const sDiv = el('div', 'sec');
    sDiv.appendChild(el('div', 'sec-hdr', sec.s));
    sec.f.forEach(f => {
      const wrap = el('div', 'field');
      if (f.type === 'mode') {
        wrap.innerHTML = `
          <label>LLM mode</label>
          <div class="mode-pair">
            <div class="mode-btn sel" data-m="local-run" onclick="pickMode('local-run')">local&#x2011;run</div>
            <div class="mode-btn cloud" data-m="cloud-run" onclick="pickMode('cloud-run')">cloud&#x2011;run</div>
          </div>`;
      } else if (f.type === 'llm_endpoint') {
        wrap.innerHTML = `
          <label>Endpoint</label>
          <div class="llm-pair">
            <div class="llm-btn" onclick="pickLLM('http://localhost:11234',this)">Blackwell&nbsp;1<br><span style="font-size:10px;font-weight:400">:11234</span></div>
            <div class="llm-btn sel" onclick="pickLLM('http://localhost:11235',this)">Blackwell&nbsp;2<br><span style="font-size:10px;font-weight:400">:11235</span></div>
            <div class="llm-btn" onclick="pickLLM('http://localhost:1234',this)">Local<br><span style="font-size:10px;font-weight:400">:1234</span></div>
          </div>
          <input type="text" id="f_llm_url" value="http://localhost:11235" placeholder="http://localhost:11235" oninput="syncLLMBtns(this.value)">`;
      } else if (f.type === 'chk') {
        wrap.innerHTML = `<label class="chk-row"><input type="checkbox" id="f_${f.id}"${f.def?' checked':''}> ${f.lbl}</label>`;
      } else if (f.type === 'sel') {
        const opts = f.opts.map(o=>`<option${o===f.def?' selected':''}>${o}</option>`).join('');
        wrap.innerHTML = `<label for="f_${f.id}">${f.lbl}${f.req?'<span class="req"> *</span>':''}</label><select id="f_${f.id}">${opts}</select>`;
      } else if (f.type === 'c2_status') {
        wrap.innerHTML = `<div id="c2-status-panel" style="font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.8">Loading...</div>`;
        setTimeout(refreshC2Status, 100);
      } else if (f.type === 'area') {
        wrap.innerHTML = `<label for="f_${f.id}">${f.lbl}${f.req?'<span class="req"> *</span>':''}</label><textarea id="f_${f.id}" placeholder="${f.ph||''}"></textarea>`;
      } else {
        wrap.innerHTML = `<label for="f_${f.id}">${f.lbl}${f.req?'<span class="req"> *</span>':''}</label><input type="${f.type==='num'?'number':'text'}" id="f_${f.id}" placeholder="${f.ph||''}" value="${f.def||''}">`;
      }
      sDiv.appendChild(wrap);
    });
    area.appendChild(sDiv);
  });
  restoreFormState(cmd);
}

  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('sel'));
  document.querySelector(`.mode-btn[data-m="${m}"]`)?.classList.add('sel');

  document.querySelectorAll('.sec').forEach(sec => {
    const hdr = sec.querySelector('.sec-hdr');
    if (hdr && hdr.textContent.trim().toUpperCase() === 'CLOUD') {
      sec.classList.toggle('sec-disabled', m === 'local-run');
    }

}

// ── Form state persistence ────────────────────────────────────────────────────
function saveFormState(cmd, data) {
  try { localStorage.setItem('mgf_state_' + cmd, JSON.stringify(data)); } catch(e) {}
}

function restoreFormState(cmd) {
  try {
    const raw = localStorage.getItem('mgf_state_' + cmd);
    if (!raw) { if (cmd !== 'ssh') pickMode('local-run'); return; }
    const saved = JSON.parse(raw);
    (CMDS[cmd] || []).forEach(sec => sec.f.forEach(f => {
      if (f.type === 'mode') {
        if (saved.mode) pickMode(saved.mode);
        return;
      }
      if (f.type === 'llm_endpoint') {
        const e = document.getElementById('f_llm_url');
        if (e && saved.llm_url) { e.value = saved.llm_url; syncLLMBtns(saved.llm_url); }
        return;
      }
      const e = document.getElementById('f_' + f.id);
      if (!e || saved[f.id] === undefined) return;
      if (f.type === 'chk') e.checked = !!saved[f.id];
      else e.value = saved[f.id];
    }));
    if (saved.mode) pickMode(saved.mode);
  } catch(e) { if (cmd !== 'ssh') pickMode('local-run'); }
}

function setSshView(active) {
  document.getElementById('term').style.display = active ? 'none' : '';
  document.getElementById('xterm-container').classList.toggle('active', active);
  document.getElementById('ssh-status').classList.toggle('active', active);
}

function setSshConnected(on) {
  sshConnected = on;
  const btn = document.getElementById('run-btn');
  btn.classList.remove('stop');
  if (on) {
    btn.textContent = '⏹  Disconnect';
    btn.classList.add('stop');
    document.getElementById('ssh-status').textContent = 'SSH — connected';
  } else {
    btn.textContent = '⏎  Connect';
    document.getElementById('ssh-status').textContent = 'SSH — disconnected';
  }
}

function connectSSH() {
  if (sshWs) { sshWs.close(); sshWs = null; }

  const host = document.getElementById('f_ssh_host')?.value.trim() || 'localhost';
  const port = parseInt(document.getElementById('f_ssh_port')?.value) || 10022;
  const user = document.getElementById('f_ssh_user')?.value.trim() || 'vmuser';
  const pass = document.getElementById('f_ssh_pass')?.value.trim() || 'vmuser123';

  // Init xterm if not done yet
  if (!sshTerm) {
    sshTerm = new Terminal({
      theme: {background:'#000000', foreground:'#c9d1d9', cursor:'#3fb950'},
      fontFamily: "'JetBrains Mono','Fira Code',Cascadia Code,Consolas,monospace",
      fontSize: 12,
      cursorBlink: true,
    });
    sshFitAddon = new FitAddon.FitAddon();
    sshTerm.loadAddon(sshFitAddon);
    sshTerm.open(document.getElementById('xterm-container'));
  }
  setSshView(true);
  sshFitAddon.fit();
  const cols = sshTerm.cols;
  const rows = sshTerm.rows;

  const ws = new WebSocket(`ws://${location.host}/ws/ssh`);
  ws.binaryType = 'arraybuffer';
  sshWs = ws;

  ws.onopen = () => {
    ws.send(JSON.stringify({host, port, username: user, password: pass, cols, rows}));
  };

  ws.onmessage = ev => {
    if (typeof ev.data === 'string') {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'connected') {
          setSshConnected(true);
          sshTerm.onData(data => { if (ws.readyState === 1) ws.send(new TextEncoder().encode(data)); });
        } else if (msg.type === 'disconnected' || msg.type === 'error') {
          sshTerm.writeln('\r\n\x1b[31m[SSH] ' + (msg.msg || 'disconnected') + '\x1b[0m');
          setSshConnected(false);
          sshWs = null;
        }
      } catch(e) {}
    } else {
      sshTerm.write(new Uint8Array(ev.data));
    }
  };

  ws.onclose = () => { if (sshConnected) { setSshConnected(false); sshTerm.writeln('\r\n\x1b[31m[SSH] connection closed\x1b[0m'); } sshWs = null; };
  ws.onerror = () => { sshTerm.writeln('\r\n\x1b[31m[SSH] websocket error\x1b[0m'); };
}

function disconnectSSH() {
  if (sshWs) { sshWs.close(); sshWs = null; }
  setSshConnected(false);
}

// resize xterm when window resizes
window.addEventListener('resize', () => {
  if (activeCmd === 'ssh' && sshFitAddon && sshTerm) {
    sshFitAddon.fit();
    if (sshWs && sshWs.readyState === 1) {
      sshWs.send(JSON.stringify({type:'resize', cols:sshTerm.cols, rows:sshTerm.rows}));
    }
  }
});

function formData() {
  const d = { command: activeCmd, mode: getMode() };
  const entry = CMDS[activeCmd];
  if (!entry || entry.build) return d;
  (entry || []).forEach(sec => {
    sec.f.forEach(f => {
      if (f.type === 'mode') return;
      if (f.type === 'llm_endpoint') {
        const e = document.getElementById('f_llm_url');
        if (e) d.llm_url = e.value.trim();
        return;
      }
      const e = document.getElementById('f_' + f.id);
      if (!e) return;
      d[f.id] = f.type === 'chk' ? e.checked : e.value.trim();
    });
  });
  return d;
}

// ── Run / Stop ────────────────────────────────────────────────────────────────
document.getElementById('run-btn').addEventListener('click', async () => {
  const btn = document.getElementById('run-btn');

  // SSH tab: connect / disconnect
  if (activeCmd === 'ssh') {
    if (sshConnected) { disconnectSSH(); } else { connectSSH(); }
    return;
  }

  // Listener tab: start / stop C2
  if (activeCmd === 'listener') {
    await toggleC2Listener();
    return;
  }

  // Chunk tab: build or stop
  if (activeCmd === 'chunk') {
    if (btn.classList.contains('stop') && activeJobId) {
      await fetch(`/api/jobs/${activeJobId}/kill`, {method:'POST'});
      appendLog('');
      appendLog(`── job ${activeJobId}: killed ──`, 'err');
      updateChip(activeJobId, 'killed');
      setRunning(false);
      setBadge('killed', false);
    } else {
      await chunkBuild();
    }
    return;
  }

  // Stop running job
  if (btn.classList.contains('stop') && activeJobId) {
    await fetch(`/api/jobs/${activeJobId}/kill`, {method:'POST'});
    appendLog('');
    appendLog(`── job ${activeJobId}: killed ──`, 'err');
    updateChip(activeJobId, 'killed');
    setRunning(false);
    setBadge('killed', false);
    return;
  }

  const d = formData();
  if (['run','generate','verify','analyze'].includes(d.command) && !d.spec) {
    flashError('Spec file is required.'); return;
  }
  if (['run','generate'].includes(d.command) && !d.malware_type) {
    flashError('Malware type is required.'); return;
  }

  saveFormState(activeCmd, d);

  // Write form values to spec.yaml before running
  if (['run', 'generate'].includes(d.command)) {
    try {
      await fetch('/api/spec/merge', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          malware_type: d.malware_type || '',
          behavior: d.behavior || '',
          source_language: d.source_language || 'c',
          output_format: d.output_format || 'exe',
          os: d.os || 'windows-11',
        }),
      });
    } catch(e) {
      flashError(`Could not update spec.yaml: ${e}`);
      return;
    }
  }

  try {
    const r = await fetch('/api/jobs', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d),
    });
    const {job_id, cmd_str} = await r.json();
    activeJobCmd = activeCmd;
    openJob(job_id, cmd_str, true);
  } catch(e) {
    flashError(`Could not start job: ${e}`);
  }
});

// ── Pause / Resume ───────────────────────────────────────────────────────────
document.getElementById('pause-btn').addEventListener('click', async () => {
  if (!activeJobId) return;
  if (activeJobPaused) {
    await fetch(`/api/jobs/${activeJobId}/resume`, {method:'POST'});
    setRunning(true, false);
  } else {
    await fetch(`/api/jobs/${activeJobId}/pause`, {method:'POST'});
    setRunning(true, true);
  }
});

// ── Job connect / replay ──────────────────────────────────────────────────────
function openJob(jobId, cmdStr, fresh) {
  if (activeWs) { activeWs.close(); activeWs = null; }
  activeJobId = jobId;

  clearTerm();
  if (cmdStr) appendLog(`$ ${cmdStr}`, 'meta');
  collapseSidebarOnMobile();

  // Mark chip active
  document.querySelectorAll('.job-chip').forEach(c => c.classList.remove('active'));
  document.getElementById(`chip-${jobId}`)?.classList.add('active');

  setRunning(true, false);
  setBadge('running', true);

  const ws = new WebSocket(`ws://${location.host}/ws/${jobId}`);
  activeWs = ws;

  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'log') {
      appendLog(m.msg);
    } else if (m.type === 'done') {
      const ok = m.status === 'success';
      appendLog('');
      appendLog(`── job ${jobId}: ${m.status} ──`, ok ? 'ok' : 'err');
      updateChip(jobId, m.status);
      setRunning(false);
      setBadge(m.status, false);
      refreshResults();
    }
  };
  ws.onerror = () => { appendLog('[portal] ws error', 'err'); setRunning(false); setBadge('error', false); };
  ws.onclose = () => { if (activeWs === ws) activeWs = null; };
}

async function loadJob(jobId) {
  if (activeWs) { activeWs.close(); activeWs = null; }
  activeJobId = jobId;

  const r = await fetch(`/api/jobs/${jobId}`);
  const job = await r.json();

  clearTerm();
  if (job.cmd_str) appendLog(`$ ${job.cmd_str}`, 'meta');
  job.output.forEach(l => appendLog(l));

  document.querySelectorAll('.job-chip').forEach(c => c.classList.remove('active'));
  document.getElementById(`chip-${jobId}`)?.classList.add('active');

  if (job.status !== 'running') {
    const ok = job.status === 'success';
    appendLog('');
    appendLog(`── job ${jobId}: ${job.status} ──`, ok ? 'ok' : 'err');
    setRunning(false);
    setBadge(job.status, false);
    updateChip(jobId, job.status);
    return;
  }

  // Re-subscribe for a still-running job
  activeJobCmd = job.command || null;
  setRunning(true, job.paused);
  setBadge(job.paused ? 'paused' : 'running', true);
  const ws = new WebSocket(`ws://${location.host}/ws/${jobId}`);
  activeWs = ws;
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'log') appendLog(m.msg);
    else if (m.type === 'done') {
      appendLog(`── job ${jobId}: ${m.status} ──`, m.status==='success'?'ok':'err');
      updateChip(jobId, m.status);
      setRunning(false);
      setBadge(m.status, false);
      refreshResults();
    }
  };
}

// ── Terminal helpers ──────────────────────────────────────────────────────────
function clearTerm() {
  const t = document.getElementById('term');
  t.innerHTML = '';
}

function appendLog(line, cls) {
  if (!cls) {
    const lo = line.toLowerCase();
    if (lo.includes('[error]') || lo.includes('error:') || /\bfailed\b/.test(lo)) cls = 'err';
    else if (lo.includes('[warning]') || lo.includes('warn')) cls = 'warn';
    else if (lo.includes('[debug]')) cls = 'dbg';
    else if (lo.includes('success') || lo.includes('undetected') || lo.includes('approved') || lo.includes('done')) cls = 'ok';
    else cls = 'info';
  }
  const d = el('div', `ll ${cls}`, line || '​');
  const t = document.getElementById('term');
  t.appendChild(d);
  t.scrollTop = t.scrollHeight;
}

// ── UI state helpers ──────────────────────────────────────────────────────────
function setRunning(on, paused) {
  const btn = document.getElementById('run-btn');
  const pauseBtn = document.getElementById('pause-btn');
  activeJobPaused = !!paused;
  if (on) {
    btn.textContent = '⏹  Stop';
    btn.classList.add('stop');
    btn.classList.remove('paused');
    pauseBtn.style.display = '';
    if (paused) {
      pauseBtn.textContent = '▶︎  Resume';
      pauseBtn.classList.remove('paused');
      pauseBtn.style.background = 'var(--green)';
      pauseBtn.style.color = '#0d1117';
    } else {
      pauseBtn.textContent = '⏸';
      pauseBtn.classList.add('paused');
      pauseBtn.style.background = '';
      pauseBtn.style.color = '';
    }
  } else {
    btn.textContent = activeCmd === 'chunk' ? '▶︎  Build' : activeCmd === 'edr' ? '▶︎  Score' : activeCmd === 'vm' ? '▶︎  Boot' : '▶︎  Run';
    btn.classList.remove('stop','paused');
    btn.disabled = false;
    pauseBtn.style.display = 'none';
    activeJobCmd = null;
    activeJobPaused = false;
  }
}

function setBadge(status, running) {
  const b = document.getElementById('status-badge');
  if (status === 'paused') {
    b.textContent = 'paused';
    b.className = 'hdr-badge paused';
  } else {
    b.textContent = running ? 'running' : status;
    b.className = 'hdr-badge' + (running ? ' running' : '');
  }
}

function flashError(msg) {
  const t = document.getElementById('term');
  document.getElementById('term-hint')?.remove();
  const d = el('div', 'll err', `[portal] ${msg}`);
  t.appendChild(d);
  t.scrollTop = t.scrollHeight;
}

async function loadSpec() {
  const editor = document.getElementById('spec-editor');
  const status = document.getElementById('spec-status');
  if (!editor) return;
  try {
    const res = await fetch('/api/spec');
    if (res.ok) {
      const data = await res.json();
      editor.value = data.content;
    } else {
      editor.value = SPEC_TEMPLATE;
      if (status) { status.style.color = 'var(--yellow)'; status.textContent = 'Template loaded — edit and save'; }

  } catch(e) {

async function saveSpec() {
  const editor = document.getElementById('spec-editor');
  const status = document.getElementById('spec-status');
  if (!editor || !status) return;
  try {
    const res = await fetch('/api/spec', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({content: editor.value})
    });
    const data = await res.json();
    if (res.ok) {
      status.style.color = 'var(--green)';
      status.textContent = 'Saved!';
    } else {
      status.style.color = 'var(--red)';
      status.textContent = data.error || 'Save failed';
    }
  } catch(e) {
    status.style.color = 'var(--red)';
    status.textContent = 'Error: ' + e.message;
  }
  setTimeout(() => { if (status) status.textContent = ''; }, 3000);
}

// ── C2 Listener ──────────────────────────────────────────────────────────────
let c2Running = false;

async function refreshC2Status() {
  try {
    const r = await fetch('/api/c2');
    const s = await r.json();
    c2Running = s.running;
    updateC2Badge(s);
    updateC2Button();
    const panel = document.getElementById('c2-status-panel');
    if (!panel) return;
    if (!s.running) {
      panel.innerHTML = '<span style="color:var(--muted)">Listener is stopped. Press Start to begin accepting connections.</span>';
      return;
    }
    let h = `<span style="color:var(--green)">Listening on ${s.host}:${s.port}</span><br>`;
    h += `Connections: ${s.total_connections} | Bytes: ${s.total_bytes.toLocaleString()}<br>`;
    if (s.connections.length) {
      h += '<br><span style="color:var(--muted);font-size:10px">RECENT CONNECTIONS:</span><br>';
      s.connections.slice(-10).reverse().forEach(c => {
        const ts = new Date(c.connected_at * 1000).toLocaleTimeString();
        const st = c.closed ? '<span style="color:var(--muted)">closed</span>' : '<span style="color:var(--green)">active</span>';
        h += `${ts} ${c.addr}:${c.port} ${st} ${c.bytes_received.toLocaleString()}B`;
        if (c.data_file && c.bytes_received > 0) {
          h += ` <span style="color:var(--accent);cursor:pointer;text-decoration:underline" onclick="viewC2Data('${c.data_file}')">[view]</span>`;
        }
        h += '<br>';
      });
    }
    panel.innerHTML = h;
  } catch(e) {
    const panel = document.getElementById('c2-status-panel');
    if (panel) panel.innerHTML = '<span style="color:var(--red)">Could not reach portal API</span>';
  }
}

function updateC2Badge(s) {
  const badge = document.getElementById('c2-badge');
  if (!badge) return;
  if (s && s.running) {
    badge.textContent = `C2: :${s.port}`;
    badge.style.borderColor = 'var(--green)';
    badge.style.color = 'var(--green)';
  } else {
    badge.textContent = 'C2: off';
    badge.style.borderColor = '';
    badge.style.color = '';
  }
}

function updateC2Button() {
  if (activeCmd !== 'listener') return;
  const btn = document.getElementById('run-btn');
  if (c2Running) {
    btn.textContent = '⏹  Stop Listener';
    btn.classList.add('stop');
  } else {
    btn.textContent = '▶︎  Start Listener';
    btn.classList.remove('stop');
  }
}

async function toggleC2Listener() {
  if (c2Running) {
    await fetch('/api/c2/stop', {method:'POST'});
    appendLog('[C2] Listener stopped', 'warn');
  } else {
    const port = parseInt(document.getElementById('f_c2_port')?.value) || 9001;
    const r = await fetch('/api/c2/start', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({port}),
    });
    const s = await r.json();
    if (s.ok) {
      appendLog(`[C2] Listener started on 0.0.0.0:${port} — waiting for callback`, 'ok');
    } else {
      appendLog(`[C2] Failed to start listener on port ${port}`, 'err');
    }
  }
  await refreshC2Status();
}

  try {

function saveChunkState() {
  try {
    const state = {};
    CHUNK_FIELDS.forEach(f => {
      const el = document.getElementById(f.id);
      if (!el) return;
      state[f.id] = f.type === 'chk' ? el.checked : el.value;
    });
    localStorage.setItem('mgf_state_chunk', JSON.stringify(state));
  } catch(e) {}
}

function restoreChunkState() {
  try {
    const raw = localStorage.getItem('mgf_state_chunk');
    if (!raw) return;
    const state = JSON.parse(raw);
    CHUNK_FIELDS.forEach(f => {
      const el = document.getElementById(f.id);
      if (!el || state[f.id] === undefined) return;
      if (f.type === 'chk') el.checked = state[f.id];
      else el.value = state[f.id];
    });
    // Sync derived UI state
    const adaptiveOpts = document.getElementById('chunk-adaptive-opts');
    if (adaptiveOpts) adaptiveOpts.style.display = state['chunk-adaptive'] ? '' : 'none';
    if (state['chunk-llm-url']) chunkSyncLLMBtns(state['chunk-llm-url']);
  } catch(e) {}
}

async function refreshChunkEdrs() {
  const div = document.getElementById('chunk-edr-toggles');
  if (!div) return;
  try {
    const r = await fetch('/api/edr/manage/status');
    _chunkEdrState = await r.json();
    const order = ['defender', 'sysmon', 'wazuh'];
    let h = '';
    for (const key of order) {
      const edr = _chunkEdrState[key];
      if (!edr) continue;
      const onClass = edr.enabled ? 'on' : '';
      const dotColor = edr.enabled === null ? 'var(--muted)' : edr.enabled ? 'var(--green)' : 'var(--red)';
      h += `<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 6px;background:var(--bg3);border-radius:3px">
        <span style="font-size:11px;display:flex;align-items:center;gap:4px">
          <span style="width:6px;height:6px;border-radius:50%;background:${dotColor}"></span>
          ${edr.name}
        </span>
        <button class="edr-toggle ${onClass}" id="chunk-edr-btn-${key}"
                onclick="chunkEdrToggle('${key}', ${!edr.enabled})"></button>
      </div>`;
    }
    div.innerHTML = h;
  } catch(e) {
    div.innerHTML = '<div style="color:var(--red);font-size:10px">VM unreachable</div>';
  }
}

async function chunkEdrToggle(component, enable) {
  const btn = document.getElementById('chunk-edr-btn-' + component);
  if (btn) btn.classList.add('pending');
  try {
    await fetch('/api/edr/manage/toggle', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({component, enable}),
    });
  } catch(e) {}
  await refreshChunkEdrs();
  if (typeof refreshEdrMgmt === 'function') refreshEdrMgmt();
}

async function chunkEdrPreset(preset) {
  document.querySelectorAll('#chunk-edr-toggles .edr-toggle').forEach(b => b.classList.add('pending'));
  try {
    await fetch('/api/edr/manage/preset', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({preset}),
    });
  } catch(e) {}
  await refreshChunkEdrs();
  if (typeof refreshEdrMgmt === 'function') refreshEdrMgmt();
}

function getActiveChunkEdrs() {
  const active = [];
  for (const [key, edr] of Object.entries(_chunkEdrState)) {
    if (key === 'wazuh_indexer') continue;
    if (edr.enabled) active.push(key);
  }
  return active;
}

let chunkRecipes = [];

async function loadChunkRecipes() {
  try {
    const r = await fetch('/api/chunk/recipes');
    chunkRecipes = await r.json();
    filterRecipes();
  } catch(e) { console.error('Failed to load recipes:', e); }
}

function filterRecipes() {
  const type = document.getElementById('chunk-type')?.value || 'infostealer';
  const sel = document.getElementById('chunk-recipe');
  const desc = document.getElementById('chunk-recipe-desc');
  if (!sel) return;
  sel.innerHTML = '';
  const filtered = chunkRecipes.filter(r => r.name.startsWith(type));
  if (!filtered.length) {
    sel.innerHTML = '<option value="">No recipes for this type</option>';
    if (desc) desc.textContent = '';
    return;
  }
  filtered.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.name;
    opt.textContent = r.name;
    sel.appendChild(opt);
  });
  updateRecipeDesc();
  sel.onchange = updateRecipeDesc;
}

function updateRecipeDesc() {
  const sel = document.getElementById('chunk-recipe');
  const desc = document.getElementById('chunk-recipe-desc');
  if (!sel || !desc) return;
  const recipe = chunkRecipes.find(r => r.name === sel.value);
  desc.textContent = recipe ? recipe.description : '';
}

function chunkTypeChanged() {
  filterRecipes();
}

async function loadChunkLayers() {
  try {
    const r = await fetch('/api/chunk/layers');
    chunkLayersData = await r.json();
    renderChunkLayers(chunkLayersData);
  } catch(e) { console.error('Failed to load layers:', e); }
}

function renderChunkLayers(layers) {
  const div = document.getElementById('chunk-layers');
  if (!div) return;
  div.innerHTML = '';
  const riskLabel = {vlow:'very low', low:'low', medium:'med', high:'high'};
  for (const [name, info] of Object.entries(layers)) {
    const field = document.createElement('div');
    field.className = 'field';
    field.style.marginBottom = '4px';
    const autoOpt = `<option value="auto" selected>auto</option>`;
    const opts = Object.entries(info.options).map(([opt, oi]) =>
      `<option value="${opt}">${opt} [${riskLabel[oi.risk] || oi.risk}]</option>`
    ).join('');
    field.innerHTML = `
      <label for="chunk-layer-${name}" style="font-size:10px">${name}</label>
      <select id="chunk-layer-${name}" style="font-size:10px">${autoOpt}${opts}</select>
    `;
    div.appendChild(field);
  }
}

async function chunkAutoSelect() {
  const detection = document.getElementById('chunk-detection')?.value || '';
  if (!detection.trim()) {
    flashError('Paste detection text first');
    return;
  }
  try {
    const r = await fetch('/api/chunk/auto-select', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({detection}),
    });
    const config = await r.json();
    for (const [layer, option] of Object.entries(config)) {
      const sel = document.getElementById(`chunk-layer-${layer}`);
      if (sel) sel.value = option;
    }
    appendLog('[chunk] Layers auto-selected from detection feedback', 'ok');
  } catch(e) {
    flashError(`Auto-select failed: ${e}`);
  }
}

function chunkGetLayers() {
  if (!chunkLayersData) return {};
  const config = {};
  for (const name of Object.keys(chunkLayersData)) {
    const sel = document.getElementById(`chunk-layer-${name}`);
    if (sel) config[name] = sel.value;
  }
  return config;
}

async function chunkBuild() {
  saveChunkState();
  const compile = document.getElementById('chunk-compile')?.checked ?? true;
  const malware_type = document.getElementById('chunk-type')?.value || 'infostealer';
  const adaptive = document.getElementById('chunk-adaptive')?.checked ?? false;
  const deploy = document.getElementById('chunk-deploy')?.checked ?? true;
  const activeEdrs = getActiveChunkEdrs();
  const maxAlgo = parseInt(document.getElementById('chunk-max-algo')?.value || '5');
  const maxLlm = parseInt(document.getElementById('chunk-max-llm')?.value || '3');
  const maxCloud = parseInt(document.getElementById('chunk-max-cloud')?.value || '2');
  const obfuscation = document.getElementById('chunk-obfuscation')?.value || 'heavy';
  const llm_url = document.getElementById('chunk-llm-url')?.value || '';
  const llm_model = document.getElementById('chunk-llm-model')?.value || '';
  const vm_port = document.getElementById('chunk-vm-port')?.value || '10022';
  const vm_user = document.getElementById('chunk-vm-user')?.value || 'vmuser';
  const vm_pass = document.getElementById('chunk-vm-pass')?.value || 'vmuser123';
  const c2_port = document.getElementById('chunk-c2-port')?.value || '9001';

  const recipe = document.getElementById('chunk-recipe')?.value || (malware_type === 'keylogger' ? 'keylogger' : 'infostealer_full');

  // Check if any layers were manually overridden
  const layers = chunkGetLayers();
  const hasOverrides = Object.values(layers).some(v => v !== 'auto');

  let body;
  if (hasOverrides) {
    const resolved = {};
    for (const [k, v] of Object.entries(layers)) {
      if (v !== 'auto') resolved[k] = v;
    }
    body = {mode: 'custom', layers: resolved, malware_type, compile, deploy, obfuscation, llm_url, llm_model, vm_port, vm_user, vm_pass, c2_port};
  } else if (adaptive) {
    try {
      const r = await fetch('/api/chunk/hybrid', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({malware_type, dry_run: false, active_edrs: activeEdrs, max_algorithmic: maxAlgo, max_llm: maxLlm, max_cloud: maxCloud, obfuscation, llm_url, llm_model}),
      });
      if (!r.ok) {
        const txt = await r.text();
        flashError(`Hybrid loop failed (${r.status}): ${txt.slice(0, 200)}`);
        return;
      }
      const {job_id, cmd_str} = await r.json();
      activeJobCmd = 'chunk';
      openJob(job_id, cmd_str, true);
    } catch(e) { flashError(`Hybrid loop failed: ${e}`); }
    return;
  } else {
    body = {mode: 'recipe', recipe, compile, deploy, obfuscation, llm_url, llm_model, vm_port, vm_user, vm_pass, c2_port};
  }

  try {
    const r = await fetch('/api/chunk/build', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const txt = await r.text();
      if (r.status === 404) {
        flashError('Build endpoint not found — restart the portal server to load updated routes');
      } else {
        flashError(`Build failed (${r.status}): ${txt.slice(0, 200)}`);
      }
      return;
    }
    const {job_id, cmd_str} = await r.json();
    activeJobCmd = 'chunk';
    openJob(job_id, cmd_str, true);
  } catch(e) {
    flashError(`Build failed: ${e}`);
  }
}

async function loadChunkHistory() {
  try {
    const r = await fetch('/api/chunk/history');
    const hist = await r.json();
    const div = document.getElementById('chunk-history');
    if (!div) return;
    const runs = hist.runs || [];
    const successes = (hist.successes || []).length;
    const detections = (hist.detections || []).length;
    if (!runs.length) {
      div.innerHTML = '<span style="color:var(--muted)">No runs yet</span>';
      return;
    }
    let h = `<div style="margin-bottom:6px;color:var(--muted)">${runs.length} runs | ${successes} success | ${detections} detected</div>`;
    const recent = runs.slice(-5).reverse();
    recent.forEach(run => {
      const status = run.success ? '<span style="color:var(--green)">OK</span>' :
                     run.detected ? '<span style="color:var(--red)">DET</span>' :
                     '<span style="color:var(--yellow)">FAIL</span>';
      h += `<div style="padding:2px 0;border-top:1px solid var(--border)">${status}`;
      if (run.detection_text) {
        const txt = run.detection_text.length > 50 ? run.detection_text.substring(0, 50) + '...' : run.detection_text;
        h += ` <span style="color:var(--muted)">${txt}</span>`;
      }
      h += '</div>';
    });
    div.innerHTML = h;
  } catch(e) {
    const div = document.getElementById('chunk-history');
    if (div) div.innerHTML = '<span style="color:var(--muted)">Could not load history</span>';
  }
}

async function refreshDetectionStatus() {
  const panel = document.getElementById('detection-status');
  if (!panel) return;
  panel.innerHTML = '<span style="color:var(--muted)">Checking...</span>';
  try {
    const r = await fetch('/api/detection/status');
    const s = await r.json();
    const dot = (on) => `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--${on?'green':'red'});margin-right:6px;vertical-align:middle"></span>`;
    let h = '';

    // Wazuh
    h += `<div>${dot(s.wazuh.online)}Wazuh Manager: ${s.wazuh.online ? 'online' : 'offline'}`;
    if (s.wazuh.online && s.wazuh.agent_id) {
      h += ` <span style="color:var(--muted)">(agent ${s.wazuh.agent_id}: ${s.wazuh.agent_name || '?'} — ${s.wazuh.agent_status})</span>`;
    }
    h += '</div>';

    // Elastic / Indexer
    h += `<div>${dot(s.elastic.online)}Wazuh Indexer: ${s.elastic.online ? 'online' : 'offline'}`;
    if (s.elastic.online) {
      h += ` <span style="color:var(--muted)">(${s.elastic.cluster_status || '?'}`;
      if (s.elastic.alert_index_exists) {
        h += `, ${(s.elastic.total_alerts || 0).toLocaleString()} total alerts`;
      }
      h += ')</span>';
    }
    h += '</div>';

    // Defender
    h += `<div>${dot(s.defender.online)}Defender: ${s.defender.online ? 'online' : 'offline'}`;
    if (s.defender.online) {
      const rt = s.defender.realtime;
      const av = s.defender.antivirus;
      h += ` <span style="color:var(--${rt && av ? 'green' : 'yellow'})">(`;
      h += rt ? 'realtime ON' : '<b>realtime OFF</b>';
      h += av ? ', AV ON' : ', <b>AV OFF</b>';
      h += ')</span>';
    }
    h += '</div>';

    panel.innerHTML = h;
  } catch(e) {
    panel.innerHTML = '<span style="color:var(--red)">Could not check detection status</span>';
  }
}

async function refreshDetectionAlerts() {
  const div = document.getElementById('detection-alerts');
  if (!div) return;
  const minutes = document.getElementById('detection-minutes')?.value || '10';
  const minLevel = document.getElementById('detection-level')?.value || '5';
  div.innerHTML = '<span style="color:var(--muted)">Loading alerts...</span>';
  try {
    const r = await fetch(`/api/detection/alerts?minutes=${minutes}&min_level=${minLevel}`);
    const data = await r.json();
    const sum = data.summary || {};
    let h = '';

    // Summary bar
    h += '<div style="padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:4px;font-size:10px">';
    if (sum.defender_total > 0) {
      h += `<span style="color:var(--red);font-weight:700">DEFENDER: ${sum.defender_total} threat(s)</span> `;
    } else {
      h += '<span style="color:var(--green)">DEFENDER: 0 threats</span> ';
    }
    h += '&nbsp;|&nbsp;';
    if (sum.wazuh_high > 0) {
      h += `<span style="color:var(--red);font-weight:700">WAZUH: ${sum.wazuh_high} high</span>`;
    } else if (sum.wazuh_medium > 0) {
      h += `<span style="color:var(--yellow)">WAZUH: ${sum.wazuh_medium} med</span>`;
    } else {
      h += `<span style="color:var(--green)">WAZUH: 0 high/med</span>`;
    }
    h += ` <span style="color:var(--muted)">(${sum.wazuh_total} total)</span>`;
    h += '</div>';

    // Defender threats
    if (data.defender && data.defender.length > 0) {
      h += '<div style="color:var(--red);font-weight:700;font-size:10px;margin:4px 0">DEFENDER DETECTIONS</div>';
      data.defender.forEach(t => {
        h += '<div style="padding:3px 4px;background:rgba(255,85,85,0.08);border-radius:3px;margin-bottom:2px">';
        h += `<span style="color:var(--red)">THREAT</span> ID=${t.threat_id}`;
        if (t.resources && t.resources.length) {
          h += ` <span style="color:var(--muted)">${t.resources[0]}</span>`;
        }
        h += '</div>';
      });
    }

    // Wazuh alerts
    if (data.wazuh && data.wazuh.length > 0) {
      h += '<div style="font-weight:700;font-size:10px;margin:6px 0 4px">WAZUH ALERTS</div>';
      data.wazuh.forEach(a => {
        const lvl = a.level || 0;
        const color = lvl >= 12 ? 'var(--red)' : lvl >= 8 ? 'var(--red)' : lvl >= 5 ? 'var(--yellow)' : 'var(--muted)';
        const tag = lvl >= 12 ? 'CRIT' : lvl >= 8 ? 'HIGH' : lvl >= 5 ? 'MED' : 'LOW';
        h += '<div style="padding:2px 0;border-bottom:1px solid var(--border)">';
        h += `<span style="color:${color};font-weight:600;min-width:36px;display:inline-block">${tag}</span> `;
        h += `<span style="color:var(--muted)">[${a.rule_id}]</span> `;
        const desc = (a.description || '').length > 70 ? a.description.substring(0, 70) + '...' : a.description;
        h += desc;
        if (a.mitre && a.mitre.id && a.mitre.id.length) {
          h += ` <span style="color:var(--accent);font-size:10px">${a.mitre.id.join(',')}</span>`;
        }
        h += '</div>';
      });
    }

    if (!data.wazuh?.length && !data.defender?.length) {
      h += '<div style="color:var(--green);padding:4px 0">No alerts in the last ' + minutes + ' minutes</div>';
    }

    div.innerHTML = h;
  } catch(e) {
    div.innerHTML = '<span style="color:var(--red)">Could not load alerts: ' + e + '</span>';
  }
}

async function refreshVmStatus() {
  const panel = document.getElementById('vm-status-panel');
  if (!panel) return;
  const os = document.getElementById('vm-os')?.value || 'windows-11';
  try {
    const r = await fetch(`/api/vm/status?os=${os}`);
    vmStatus = await r.json();
    let h = '';
    const dot = (on) => `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--${on?'green':'red'});margin-right:6px"></span>`;
    h += `<div>${dot(vmStatus.disk_exists)}Disk: ${vmStatus.disk_exists ? 'installed' : 'not found'}</div>`;
    h += `<div>${dot(vmStatus.qemu_running)}QEMU: ${vmStatus.qemu_running ? 'running' : 'stopped'}</div>`;
    h += `<div>${dot(vmStatus.ssh_reachable)}SSH: ${vmStatus.ssh_reachable ? 'connected (port 10022)' : 'unreachable'}</div>`;
    panel.innerHTML = h;
    updateVmButtons();
  } catch(e) {
    panel.innerHTML = '<span style="color:var(--red)">Could not check VM status</span>';
  }
}

function updateVmButtons() {
  const bootBtn = document.getElementById('vm-boot-btn');
  const shutBtn = document.getElementById('vm-shutdown-btn');
  if (!bootBtn || !shutBtn) return;
  if (vmStatus.qemu_running) {
    bootBtn.disabled = true;
    bootBtn.style.opacity = '0.35';
    bootBtn.style.cursor = 'not-allowed';
    shutBtn.disabled = false;
    shutBtn.style.opacity = '1';
    shutBtn.style.cursor = 'pointer';
  } else {
    bootBtn.disabled = !vmStatus.disk_exists;
    bootBtn.style.opacity = vmStatus.disk_exists ? '1' : '0.35';
    bootBtn.style.cursor = vmStatus.disk_exists ? 'pointer' : 'not-allowed';
    shutBtn.disabled = true;
    shutBtn.style.opacity = '0.35';
    shutBtn.style.cursor = 'not-allowed';
  }
}

async function vmBoot() {
  const os = document.getElementById('vm-os')?.value || 'windows-11';
  const btn = document.getElementById('vm-boot-btn');
  btn.disabled = true;
  btn.textContent = 'Booting...';
  appendLog(`[VM] Booting ${os}...`, 'meta');
  try {
    const r = await fetch('/api/vm/boot', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({os}),
    });
    const data = await r.json();
    if (r.ok) {
      appendLog(`[VM] Booted (PID=${data.pid}). SSH: ${data.ssh_ready ? 'ready' : 'waiting...'}`, 'ok');
    } else {
      appendLog(`[VM] Boot failed: ${data.error}`, 'err');
    }
  } catch(e) {
    appendLog(`[VM] Boot error: ${e}`, 'err');
  }
  btn.textContent = 'Boot VM';
  await refreshVmStatus();
}

async function vmSnapshot(action) {
  appendLog(`[VM] Snapshot ${action}...`, 'meta');
  try {
    const r = await fetch('/api/vm/snapshot', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action, tag: 'portal_snapshot'}),
    });
    const {job_id, cmd_str} = await r.json();
    activeJobCmd = 'vm';
    openJob(job_id, cmd_str, true);
  } catch(e) {
    appendLog(`[VM] Snapshot error: ${e}`, 'err');
  }
}

async function edrRunScore() {
  const payload = document.getElementById('edr-payload-path')?.value.trim();
  const type = document.getElementById('edr-payload-type')?.value || 'infostealer';
  if (!payload) { flashError('Payload path required'); return; }
  try {
    const r = await fetch('/api/edr/run', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({payload, type}),
    });
    const {job_id, cmd_str} = await r.json();
    activeJobCmd = 'edr';
    openJob(job_id, cmd_str, true);
  } catch(e) { flashError('EDR score failed: ' + e); }
}

async function edrScoreOnly() {
  const evtx = document.getElementById('edr-evtx-path')?.value.trim();
  if (!evtx) { flashError('EVTX path required'); return; }
  try {
    const r = await fetch('/api/edr/score-only', {
      method:'POST', headers:{'Content-Type':'application/json'},

}

async function refreshEdrMgmt() {
  const div = document.getElementById('edr-mgmt-status');
  if (!div) return;
  try {
    const r = await fetch('/api/edr/manage/status');
    const data = await r.json();
    const order = ['defender', 'sysmon', 'wazuh', 'wazuh_indexer'];
    let h = '';
    for (const key of order) {
      const edr = data[key];
      if (!edr) continue;
      const isHost = key === 'wazuh_indexer';
      const onClass = edr.enabled ? 'on' : '';
      const toggleAttr = isHost ? 'style="opacity:.4;pointer-events:none" title="Host service — manage via docker"' : `onclick="edrToggle('${key}', ${!edr.enabled})"`;
      const dotColor = edr.enabled === null ? 'var(--muted)' : edr.enabled ? 'var(--green)' : 'var(--red)';
      h += `<div class="edr-row">
        <div class="edr-info">
          <div class="edr-name" style="display:flex;align-items:center;gap:5px">
            <span style="width:7px;height:7px;border-radius:50%;background:${dotColor};flex-shrink:0"></span>
            ${edr.name}
          </div>
          <div class="edr-detail">${edr.detail}</div>
        </div>
        <button class="edr-toggle ${onClass}" id="edr-btn-${key}" ${toggleAttr}></button>
      </div>`;
    }
    div.innerHTML = h;
  } catch(e) {
    div.innerHTML = '<div style="color:var(--red);font-size:11px">Could not query VM — is it running?</div>';
  }
}

async function edrToggle(component, enable) {
  const btn = document.getElementById('edr-btn-' + component);
  if (btn) btn.classList.add('pending');
  try {
    await fetch('/api/edr/manage/toggle', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({component, enable}),
    });
  } catch(e) { flashError('Toggle failed: ' + e); }
  await refreshEdrMgmt();
}

async function edrPreset(preset) {
  document.querySelectorAll('.edr-toggle').forEach(b => b.classList.add('pending'));
  try {
    await fetch('/api/edr/manage/preset', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({preset}),
    });
  } catch(e) { flashError('Preset failed: ' + e); }
  await refreshEdrMgmt();
}

async function refreshEdrScores() {
  const div = document.getElementById('edr-scores-list');
  if (!div) return;
  try {
    const r = await fetch('/api/edr/scores');
    const files = await r.json();
    if (!files.length) {
      div.innerHTML = '<span style="color:var(--muted)">No scores yet. Run a payload to generate.</span>';
      return;
    }
    const scores = files.filter(f => f.startsWith('score_'));
    const evtx = files.filter(f => f.startsWith('sysmon_'));
    let h = '';
    if (scores.length) {
      h += '<div style="margin-bottom:4px;color:var(--muted);font-size:10px;font-weight:700">REPORTS</div>';
      scores.slice(0, 10).forEach(f => {
        const ts = f.replace('score_','').replace('.txt','').replace('.json','');
        const isJson = f.endsWith('.json');
        const icon = isJson ? '' : '';
        h += `<div style="padding:2px 0;cursor:pointer;color:var(--accent);border-bottom:1px solid var(--border)"
                   onclick="viewEdrScore('${f}')">${icon} ${f}</div>`;
      });
    }
    if (evtx.length) {
      h += '<div style="margin-top:8px;margin-bottom:4px;color:var(--muted);font-size:10px;font-weight:700">EVTX CAPTURES</div>';
      evtx.slice(0, 5).forEach(f => {
        const size = '';
        h += `<div style="padding:2px 0;color:var(--muted);border-bottom:1px solid var(--border)">${f}</div>`;
      });
    }
    div.innerHTML = h;
  } catch(e) {
    div.innerHTML = '<span style="color:var(--red)">Could not load scores</span>';
  }
}

async function viewEdrScore(filename) {
  try {
    const r = await fetch('/api/edr/scores/' + filename);
    const txt = await r.text();
    document.getElementById('modal-title').textContent = filename;
    document.getElementById('modal-body').textContent = txt;
    document.getElementById('modal-bg').classList.add('open');
  } catch(e) { flashError('Could not load ' + filename); }
}

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}
