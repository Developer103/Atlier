# Malware Generation Framework — Target Environment Spec Template
# Required: os_platform, os_version (everything else auto-completes if omitted)

os_platform: linux                    # REQUIRED: linux | windows
os_version: ubuntu-24.04            # REQUIRED: ubuntu-24.04 | ubuntu-22.04 | debian-bookworm | windows-11 | windows-10

# Freeform description of malware behaviour / purpose (auto-defaults if omitted)
# The LLM reads this and decides payload format, runtime actions, DB queries, etc.
# Examples: "elf backdoor", "bash recon script", "python keylogger"
malware_type: elf backdoor

# Security stack on target (auto-normalized, empty = none)
edrs:                                 # EDR products — e.g. ["crowdstrike", "sentinel_one", "defender"]
  - ""
antivirus: null                       # AV product name or null
patch_level: null                     # OS patch level — e.g. "latest" | "2023-Q1"

# Build tools available on target (auto-defaults if omitted)
installed_compilers:                  # e.g. ["gcc", "mingw-w64", "python3"]
  - ""
common_tools:                         # e.g. ["powershell", "dotnet", "nodejs"]
  - ""

# Network / domain
network_config: null                  # Optional dict for custom network config
domain_joined: false                  # AD-joined machine?
admin_rights: true                    # Does malware run with admin/root privileges?

# Sandbox / detection environment
sandbox_detectors:                    # VM/sandbox checks present — e.g. ["vmware", "cuckoo", "virtualbox"]
  - ""
custom_gates:                         # Evasion requirements (free-form strings)
  - ""

# Metadata
notes: null                           # Free-form notes about the target environment
