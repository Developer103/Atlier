name: bat_recon_quick
description: Quick batch recon - sysinfo, network, processes only
format: batch

core:
  - core/output

collectors:
  - collectors/sysinfo
  - collectors/processes
  - collectors/network

exfil: exfil/file_drop
arch: arch/sequential

evasion: []

vars:
  OUTPUT_FILE: "%TEMP%\\diag_%RANDOM%.log"
